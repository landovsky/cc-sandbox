# side-image.yml: builds the sidecar image `ccsbx` (ghcr.io/landovsky/ccsbx) for linux/amd64 and linux/arm64: the
# static `ccsbx` binary alone in a FROM scratch image (image-side/Dockerfile), uid/gid 10002, no shell. It pushes
# to ghcr.io/landovsky/ccsbx, runs tests/side-image-test.sh against what was pushed, and only then writes the
# digest down as a candidate. The digest feeds `k8s_side_image` in ccsbx-root.toml and the k3s manifests (cc-sandbox:#3wsr).
# Nothing refers to the image by tag.
#
# Safety: no secret but the job's own GITHUB_TOKEN (packages: write, contents: read), no trigger from a pull request,
# every action pinned by commit SHA (the tag is in the comment), no `latest` tag. A pushed image that fails its tests
# stays in the registry but is never written to digest.txt and the summary says it is NOT a candidate.
# The Go toolchain comes from go.mod (`go 1.27`); the binaries are built here, not in a base image, so there is no
# base to pin.
name: side-image

on:
  push:
    branches: [main]
    paths: ["image-side/**", "cmd/ccsbx/**", "internal/**", "go.mod", "tests/side-image-test.sh", ".github/workflows/side-image.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: side-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/landovsky/ccsbx

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: No third-party module crept in (the build is the standard library only)
        run: test ! -e go.sum

      - name: Build the static binary for both architectures
        run: |
          set -eu
          mkdir -p image-side/bin
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
              -o "image-side/bin/ccsbx-linux-$arch" ./cmd/ccsbx
          done
          file image-side/bin/* || true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-side
          file: image-side/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # a tag is needed to push; consumers use the digest, never this tag
          tags: ${{ env.IMAGE }}:cand-${{ github.sha }}
          # links the package to this repository (so later runs of this workflow may write it)
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false

      - name: The pushed index lists both architectures
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:[0-9a-f]*) ;; *) echo "no digest from the push: '$DIGEST'" >&2; exit 1;; esac
          out=$(docker buildx imagetools inspect "$IMAGE@$DIGEST")
          echo "$out"
          echo "$out" | grep -q 'Platform: *linux/amd64'
          echo "$out" | grep -q 'Platform: *linux/arm64'

      - name: Pull the pushed amd64 image by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          # a local name for the tests (they build bad images FROM it and read its layers)
          docker tag "$IMAGE@$DIGEST" ccsbx-side:candidate

      # The multi-platform builder (docker-container driver) cannot see local images; the tests build
      # throwaway images FROM the candidate and the bad-pin build, so they use the default builder.
      - name: Tests use the default (docker) builder
        run: docker buildx use default

      - name: "T:side-image (user, no shell, no setuid, serves on a read-only root)"
        run: |
          set -eu
          export CCSBX_TEST_IMAGE=ccsbx-side:candidate
          tests/side-image-test.sh all

      # Only reached when every step above passed: this is what makes the digest a candidate.
      - name: Write the candidate digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > digest.txt
          {
            echo "## sidecar image candidate"
            echo
            echo "\`$(cat digest.txt)\`"
            echo
            echo "linux/amd64 and linux/arm64, built from \`${GITHUB_SHA}\`, tests green on amd64"
            echo "(side-user, side-no-shell, side-no-setuid, side-runs, each with its red twin)."
            echo "arm64 is built but not run by these tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest
          path: digest.txt
          if-no-files-found: error

      - name: Say so when it is NOT a candidate
        if: failure() && steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## sidecar image: NOT a candidate"
            echo
            echo "\`$IMAGE@$DIGEST\` was pushed but a step failed. Do not pin it."
          } >> "$GITHUB_STEP_SUMMARY"
