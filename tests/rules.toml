# The allow/block catalogue (build plan §6, invariant 23). One [[rule]] per T:<id>.
#
#   id          the T:<id> name, without the prefix
#   title       what the rule protects, in a sentence
#   suite       fence | outbox | settings | keys | git | doors | msg | approvals | cluster | verbs
#   allow       twin 1: a shell command (run from the repo root) that exits 0 when the legitimate
#               path still works. Without it, a fence that blocks everything would pass.
#   block       twin 2: exits 0 when the forbidden path is refused.
#   invariants  the doc-1 invariant numbers the rule enforces
#   backends    docker | k8s | unit (a rule runs on every backend it lists)
#   where       hp | mac | mac-kubeconfig | any
#
# "pending" as a twin means declared, not built: reported as pending, fails `selftest --strict`.
# A row with a missing or empty allow/block fails `make test` (internal/rules meta-test).
# Twins see CCSBX_BACKEND, CCSBX_RULE and CCSBX_TWIN in their environment.

[[rule]]
id = "fence-flags"
title = "the fence runs with the fixed flags: uid 10001, read-only, no caps, no-new-privileges, pids, no host env"
suite = "fence"
allow = "tests/fence-test.sh fence-flags allow"
block = "tests/fence-test.sh fence-flags block"
invariants = [2, 3, 14]
backends = ["docker"]
where = "hp"

[[rule]]
id = "no-internet"
title = "the fence is on an --internal network: no route out"
suite = "fence"
allow = "tests/fence-test.sh no-internet allow"
block = "tests/fence-test.sh no-internet block"
invariants = [4]
backends = ["docker"]
where = "hp"

[[rule]]
id = "no-dns-exfil"
title = "the fence has no resolver, so a canary domain's log stays empty"
suite = "fence"
allow = "tests/fence-test.sh no-dns-exfil allow"
block = "tests/fence-test.sh no-dns-exfil block"
invariants = [4, 10]
backends = ["docker"]
where = "hp"

[[rule]]
id = "outbox-per-gen"
title = "out/ and in/ live under a per-generation directory, never shared or reused"
suite = "outbox"
allow = "tests/fence-test.sh outbox-per-gen allow"
block = "tests/fence-test.sh outbox-per-gen block"
invariants = [10, 11]
backends = ["docker"]
where = "hp"

[[rule]]
id = "image-no-secret"
title = "the fence image holds no credential, token or key"
suite = "fence"
allow = "pending"
block = "pending"
invariants = [2, 26]
backends = ["docker"]
where = "hp"

[[rule]]
id = "deny-under-bypass"
title = "the compiled managed settings keep the deny list when the session runs in bypassPermissions"
suite = "settings"
allow = "tests/twin-go.sh ./internal/settings TestDenyUnderBypassAllow"
block = "tests/twin-go.sh ./internal/settings TestDenyUnderBypassBlock"
invariants = [3, 7]
backends = ["unit", "docker"]
where = "hp"

[[rule]]
id = "worktree-mcp-ignored"
title = "an MCP server declared inside the worktree is not loaded; managed MCP is ccf only"
suite = "settings"
allow = "tests/twin-go.sh ./internal/settings TestWorktreeMCPIgnoredAllow"
block = "tests/twin-go.sh ./internal/settings TestWorktreeMCPIgnoredBlock"
invariants = [3, 25]
backends = ["unit", "docker"]
where = "hp"

# ---- U3a: ccsbx-hostd (outbox reader). Direct mode: every result is "not evidence". ----

[[rule]]
id = "stamp-from-outbox"
title = "a request's identity comes from the outbox path and the session record, never from the file's bytes"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestStampFromOutboxAllow"
block = "tests/twin-go.sh ./internal/hostd TestStampFromOutboxBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

[[rule]]
id = "outbox-symlink"
title = "a symlink in the outbox (to a host file, or inside it) is never followed or read"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxSymlinkAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxSymlinkBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

[[rule]]
id = "outbox-fifo"
title = "a FIFO in the outbox cannot hang the daemon"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxFifoAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxFifoBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

[[rule]]
id = "outbox-hardlink"
title = "a hard-linked file (nlink != 1) in the outbox is refused"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxHardlinkAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxHardlinkBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

[[rule]]
id = "outbox-sparse"
title = "a sparse file bigger than the cap is refused by its apparent size, unread"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxSparseAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxSparseBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

[[rule]]
id = "outbox-flood"
title = "thousands of request files cost bounded work: a burst is served, the rest is shed"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxFloodAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxFloodBlock"
invariants = [10]
backends = ["unit"]
where = "hp"

# RED in direct mode by design: tomas can write the outbox until the privilege split (gate M).
[[rule]]
id = "outbox-host-write-refused"
title = "the host user cannot write into an outbox (only the fence uid can; the daemon only reads)"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxHostWriteRefusedAllow"
block = "CCSBX_TWIN=1 tests/twin-go.sh ./internal/hostd TestOutboxHostWriteRefusedBlock"
invariants = [10, 14]
backends = ["docker"]
where = "hp"

# ---- U3b: local message delivery (scope rule, stamp, send-keys). Direct mode: not evidence. ----

[[rule]]
id = "msg-in-scope"
title = "a worker's message to its manager lands stamped 'fenced', identity from the daemon's record"
suite = "msg"
allow = "tests/twin-go.sh ./internal/msg TestMsgInScopeAllow"
block = "tests/twin-go.sh ./internal/msg TestMsgInScopeBlock"
invariants = [8]
backends = ["unit"]
where = "hp"

[[rule]]
id = "msg-out-of-scope"
title = "a message to a session outside manager/peers/reply-to-sender is refused: scope, nothing delivered"
suite = "msg"
allow = "tests/twin-go.sh ./internal/msg TestMsgOutOfScopeAllow"
block = "tests/twin-go.sh ./internal/msg TestMsgOutOfScopeBlock"
invariants = [8]
backends = ["unit"]
where = "hp"

[[rule]]
id = "msg-no-cockpit"
title = "with cc-tree and the hub unreachable a same-machine message still lands in the pane (real tmux)"
suite = "msg"
allow = "tests/twin-go.sh ./internal/msg TestMsgNoCockpitAllow"
block = "tests/twin-go.sh ./internal/msg TestMsgNoCockpitBlock"
invariants = [8]
backends = ["unit"]
where = "hp"

# ---- review fixes (U3a) and M3 (journal). Direct mode: not evidence. ----

[[rule]]
id = "outbox-stale-generation"
title = "a request from an old or ended generation is answered stale and never stamped with the live generation's identity"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestOutboxStaleGenerationAllow"
block = "tests/twin-go.sh ./internal/hostd TestOutboxStaleGenerationBlock"
invariants = [1, 9, 15]
backends = ["unit"]
where = "hp"

[[rule]]
id = "ledger-fail-closed"
title = "if the request ledger can't be written the handler does not run, so a restart can't replay under a new ULID"
suite = "outbox"
allow = "tests/twin-go.sh ./internal/hostd TestLedgerFailClosedAllow"
block = "tests/twin-go.sh ./internal/hostd TestLedgerFailClosedBlock"
invariants = [20]
backends = ["unit"]
where = "hp"

[[rule]]
id = "journal-durable"
title = "an acknowledged journal event survives a crash; a torn tail leaves no gap and no duplicate"
suite = "verbs"
allow = "tests/twin-go.sh ./internal/journal TestJournalDurableAllow"
block = "tests/twin-go.sh ./internal/journal TestJournalDurableBlock"
invariants = [28]
backends = ["unit"]
where = "hp"

[[rule]]
id = "epoch-reset-reingest"
title = "after a journal wipe (new epoch) outboxes are re-read: events, lifecycle and unreplied requests come back, answered ones don't run twice"
suite = "verbs"
allow = "tests/twin-go.sh ./internal/hostd TestEpochResetReingestAllow"
block = "tests/twin-go.sh ./internal/hostd TestEpochResetReingestBlock"
invariants = [28]
backends = ["unit"]
where = "hp"

# ---- review fixes for U3b: never type into a pane that is not at its prompt ----

[[rule]]
id = "msg-not-into-menu"
title = "a message is typed only into a pane at its input prompt; a menu (permission prompt, question) is never answered by a stamp's keystrokes"
suite = "msg"
allow = "tests/twin-go.sh ./internal/msg TestMsgNotIntoMenuAllow"
block = "tests/twin-go.sh ./internal/msg TestMsgNotIntoMenuBlock"
invariants = [5, 6]
backends = ["unit"]
where = "hp"

[[rule]]
id = "idle-per-generation"
title = "a resumed session's new generation is idle only after ITS OWN Stop, never on the old generation's"
suite = "msg"
allow = "tests/twin-go.sh ./internal/journal TestIdleIsPerGenerationAllow"
block = "tests/twin-go.sh ./internal/journal TestIdleIsPerGenerationBlock"
invariants = [5, 6]
backends = ["unit"]
where = "hp"

[[rule]]
id = "idle-notification-type"
title = "after a Stop, a Notification of type idle_prompt stays idle; permission_prompt and any other (or untyped) one means a menu is up"
suite = "msg"
allow = "tests/twin-go.sh ./internal/journal TestIdleNotificationTypeAllow"
block = "tests/twin-go.sh ./internal/journal TestIdleNotificationTypeBlock"
invariants = [5, 6]
backends = ["unit"]
where = "hp"
