backends = ["docker"]
where = "hp"

[[rule]]
id = "settings-wire-the-layer-only-onto-an-image-that-has-it"
title = "the managed settings wire the client layer's hooks, statusLine and ccf MCP server only onto an image that carries it (the build's digest label); a hook whose script is missing would exit 2, which Claude Code treats as blocking, and refuse every prompt"
suite = "settings"
allow = "tests/go-test.sh ./internal/settings 'TestFreshFenceStartsWithoutPrompts$'"
block = "tests/go-test.sh ./internal/settings 'TestNoLayerNoHooksNoStatuslineNoServer$'"
invariants = [12]
backends = ["unit"]
where = "any"

[[rule]]
id = "backend-reads-the-layer-label"
title = "a run learns whether its image carries the client layer from the image's digest label; an unreadable image or a label that is not a digest is an error, never a quiet no-layer"
suite = "settings"
allow = "tests/go-test.sh ./internal/backend 'TestEnvIsExplicit$'"
block = "tests/go-test.sh ./internal/backend 'TestTheLayerIsThereOnlyWhenTheImageSaysSo$'"
invariants = [12]
backends = ["unit"]
where = "any"
